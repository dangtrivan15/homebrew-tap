name: Check for new releases

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch: # Allow manual trigger

# Read-only: this token no longer pushes. It authenticates the `gh` calls that
# read releases from the upstream project repos, which is a public-read operation.
# The push is made with the App token minted in the job below.
permissions:
  contents: read

# cancel-in-progress: false because the job commits per-cask and pushes at
# the end -- cancelling mid-loop would leave staged commits unpushed.
concurrency:
  group: check-releases
  cancel-in-progress: false

jobs:
  check-releases:
    runs-on: arc-runner-homebrew-tap
    timeout-minutes: 10
    steps:
      # The App credentials arrive as runner container environment, injected from a
      # SOPS-encrypted Secret in the cluster repo rather than set by hand as Actions
      # secrets, so the credential is version-controlled and rotates by commit.
      #
      # Runner env is not visible to the `secrets` or `env` expression contexts -- only
      # to the shell inside a `run:` step -- so it has to be promoted into $GITHUB_ENV
      # before the token action, which reads inputs only, can be handed it.
      #
      # ::add-mask:: per line matters here: an Actions secret is masked in logs
      # automatically, runner env is not. Without this the PEM would print in clear the
      # first time any step echoed its environment.
      - name: Load App credentials from the runner environment
        run: |
          set -euo pipefail

          if [ -z "${PUSH_APP_CLIENT_ID:-}" ] || [ -z "${PUSH_APP_PRIVATE_KEY:-}" ]; then
            echo "App creds missing from the runner environment -- is the" \
                 "github-app-homebrew-tap-push Secret wired onto this runner?" >&2
            exit 1
          fi

          while IFS= read -r _line; do
            if [ -n "$_line" ]; then echo "::add-mask::$_line"; fi
          done <<< "$PUSH_APP_PRIVATE_KEY"

          {
            echo "PUSH_APP_CLIENT_ID=$PUSH_APP_CLIENT_ID"
            echo "PUSH_APP_PRIVATE_KEY<<__PEM_EOF__"
            printf '%s\n' "$PUSH_APP_PRIVATE_KEY"
            echo "__PEM_EOF__"
          } >> "$GITHUB_ENV"

      # The default GITHUB_TOKEN pushes as github-actions[bot], which is not a bypass
      # actor on main's ruleset -- the ruleset requires a pull request and verified
      # signatures, so a direct push is rejected with GH013 on both counts. A ruleset
      # bypass is evaluated per-actor and covers the whole ruleset at once, so pushing
      # as an App on the bypass list clears both rules without the commits needing to
      # be signed. A token's identity cannot be changed, only its permissions, which is
      # why this needs a separate credential rather than a permissions tweak.
      #
      # owner/repositories are deliberately omitted: the token then defaults to this
      # repository alone. permission-contents pins it to the single permission the push
      # needs, so a token lifted out of this job cannot reach anything else.
      - name: Mint push token
        id: push-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.PUSH_APP_CLIENT_ID }}
          private-key: ${{ env.PUSH_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          # Persisted into http.extraheader, which is what `git push` at the end
          # of the run authenticates with.
          token: ${{ steps.push-token.outputs.token }}

      - name: Check and update casks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          updated=0

          for cask_file in Casks/*.rb; do
            [ -f "$cask_file" ] || continue

            cask_name=$(basename "$cask_file" .rb)
            echo "::group::Checking $cask_name"

            # Extract current version
            current_version=$(grep -m1 'version "' "$cask_file" | sed 's/.*version "//;s/".*//')

            # Extract homepage to determine GitHub repo
            homepage=$(grep -m1 'homepage "' "$cask_file" | sed 's/.*homepage "//;s/".*//')

            # Only process GitHub-hosted casks
            if [[ ! "$homepage" =~ ^https://github.com/ ]]; then
              echo "Skipping: not a GitHub project"
              echo "::endgroup::"
              continue
            fi

            repo=$(echo "$homepage" | sed 's|https://github.com/||;s|/$||')

            # Get latest release tag
            latest_tag=$(gh api "repos/$repo/releases/latest" --jq '.tag_name' 2>/dev/null) || {
              echo "Skipping: no releases found for $repo"
              echo "::endgroup::"
              continue
            }
            latest_version="${latest_tag#v}"

            if [ "$current_version" = "$latest_version" ]; then
              echo "Up to date ($current_version)"
              echo "::endgroup::"
              continue
            fi

            echo "New version found: $current_version -> $latest_version"

            # Extract URL templates and current sha256 values (in order of appearance)
            mapfile -t url_templates < <(grep 'url "' "$cask_file" | sed 's/.*url "//;s/".*//')
            mapfile -t old_shas < <(grep 'sha256 "' "$cask_file" | sed 's/.*sha256 "//;s/".*//')

            if [ "${#url_templates[@]}" -ne "${#old_shas[@]}" ]; then
              echo "::warning::Skipping $cask_name: url count (${#url_templates[@]}) != sha256 count (${#old_shas[@]})"
              echo "::endgroup::"
              continue
            fi

            # Download each asset with the new version and compute sha256
            new_shas=()
            failed=false
            for url_template in "${url_templates[@]}"; do
              asset_name=$(basename "$url_template")
              echo "Downloading: $asset_name from $repo v$latest_version"

              new_sha=$(gh release download "v$latest_version" --repo "$repo" --pattern "$asset_name" --output - | sha256sum | awk '{print $1}') || {
                echo "::warning::Failed to download: $asset_name"
                failed=true
                break
              }

              echo "SHA256: $new_sha"
              new_shas+=("$new_sha")
            done

            if [ "$failed" = true ]; then
              echo "Skipping $cask_name due to download failure"
              echo "::endgroup::"
              continue
            fi

            # Update version
            sed -i "s/version \"$current_version\"/version \"$latest_version\"/" "$cask_file"

            # Update sha256 values in order of appearance
            for i in "${!old_shas[@]}"; do
              sed -i "s/${old_shas[$i]}/${new_shas[$i]}/" "$cask_file"
            done

            # Commit this cask individually for clean history
            git add "$cask_file"
            git commit -m "Update $cask_name cask to v$latest_version"

            updated=$((updated + 1))
            echo "::endgroup::"
          done

          if [ "$updated" -gt 0 ]; then
            echo "### $updated cask(s) updated" >> "$GITHUB_STEP_SUMMARY"
            git pull --rebase origin main
            git push
          else
            echo "### All casks up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "All casks are up to date"
          fi
